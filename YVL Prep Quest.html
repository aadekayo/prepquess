<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>YVL Prep Quest</title>
<link href="https://fonts.googleapis.com/css2?family=Pirata+One&family=Space+Grotesk:wght@400;500;700&display=swap" rel="stylesheet">
<style>
:root{--bg:#060606;--card:#111;--card2:#161616;--line:#262626;--ink:#f3f3f3;--mute:#8d8d8d;--red:#e10600;--red2:#ff3b30;--ok:#3ddc84;--bad:#ff4d4d}
*{box-sizing:border-box;margin:0;padding:0}
html{scroll-behavior:smooth}
body{background:var(--bg);color:var(--ink);font-family:'Space Grotesk',system-ui,sans-serif;min-height:100vh;line-height:1.45}
#fx{position:fixed;inset:0;width:100%;height:100%;z-index:0;pointer-events:none}
body:before{content:"";position:fixed;inset:0;z-index:0;pointer-events:none;background:radial-gradient(1100px 520px at 50% -160px,rgba(190,0,0,.33),transparent 65%),radial-gradient(700px 400px at 100% 100%,rgba(120,0,0,.16),transparent 70%)}
.top,main,nav.tabs{position:relative;z-index:1}
h1,h2,h3,.gothic{font-family:'Pirata One','Space Grotesk',serif;font-weight:400;letter-spacing:.5px}
a{color:inherit}
.top{position:sticky;top:0;z-index:5;background:rgba(6,6,6,.82);backdrop-filter:blur(10px);border-bottom:1px solid var(--line)}
.top .in{max-width:980px;margin:0 auto;padding:10px 16px;display:flex;align-items:center;justify-content:space-between;gap:12px}
.logo{font-size:28px;line-height:1;cursor:pointer;white-space:nowrap}
.logo b{color:var(--red);font-weight:400;text-shadow:0 0 18px rgba(225,6,0,.7)}
.links{display:none;gap:4px}
.links button{padding:8px 12px;border-radius:999px;font-size:14px;font-weight:700;color:var(--mute)}
.links button.on,.links button:hover{color:var(--ink);background:#1a1a1a}
.pills{display:flex;gap:6px}
.pill{display:inline-flex;gap:6px;align-items:center;border:1px solid var(--line);background:#0d0d0d;padding:6px 10px;border-radius:999px;font-size:13px;font-weight:700;white-space:nowrap}
main{max-width:760px;margin:0 auto;padding:18px 16px 110px}
.card{background:linear-gradient(180deg,var(--card2),var(--card));border:1px solid var(--line);border-radius:20px;padding:18px;margin-bottom:14px}
.hero{position:relative;overflow:hidden;background:linear-gradient(135deg,#240000,#0c0c0c 62%);border-color:#4a0c0c;padding:22px}
.hero svg.bat{position:absolute;right:-30px;top:-6px;width:260px;opacity:.16;fill:#ff2a1f;transform:rotate(-8deg)}
.rank{font-size:46px;line-height:1.02;text-shadow:0 0 30px rgba(225,6,0,.45)}
.sub{color:var(--mute);font-size:13px}
.bar{height:10px;background:#1d1d1d;border-radius:99px;overflow:hidden;margin:10px 0 6px}
.bar i{display:block;height:100%;background:linear-gradient(90deg,var(--red),var(--red2));border-radius:99px;transition:width .4s;box-shadow:0 0 12px rgba(225,6,0,.6)}
button{font:inherit;color:inherit;cursor:pointer;border:0;background:none}
.btn{display:block;width:100%;padding:15px;border-radius:14px;background:var(--red);color:#fff;font-weight:700;font-size:16px;box-shadow:0 4px 0 #7d0300;transition:transform .08s;text-align:center;text-decoration:none}
.btn:active{transform:translateY(3px);box-shadow:0 1px 0 #7d0300}
.btn.ghost{background:#1b1b1b;box-shadow:0 4px 0 #000;border:1px solid var(--line)}
.btn.sm{display:inline-block;width:auto;padding:9px 14px;font-size:14px;border-radius:11px}
.btns{display:flex;gap:10px;flex-wrap:wrap}
.btns .btn{flex:1}
.grid{display:grid;grid-template-columns:repeat(auto-fill,minmax(200px,1fr));gap:12px;margin-bottom:14px}
.mod{text-align:left;padding:16px;border-radius:18px;background:linear-gradient(180deg,var(--card2),var(--card));border:1px solid var(--line);min-height:128px;display:flex;flex-direction:column;justify-content:space-between;transition:.15s}
.mod:hover{border-color:var(--red);transform:translateY(-2px);box-shadow:0 10px 30px rgba(225,6,0,.15)}
.mod .n{font-family:'Pirata One';font-size:23px;line-height:1.1}
.mod .p{font-size:12px;color:var(--mute)}
.mini{height:5px;background:#222;border-radius:9px;margin-top:8px;overflow:hidden}.mini i{display:block;height:100%;background:var(--red2)}
.tag{font-size:11px;text-transform:uppercase;letter-spacing:1.6px;color:var(--red2);font-weight:700}
.q{font-size:21px;font-weight:700;line-height:1.3;margin:10px 0 16px}
.opt{display:flex;gap:12px;align-items:center;width:100%;text-align:left;padding:14px;border-radius:14px;border:2px solid var(--line);background:#0e0e0e;margin-bottom:10px;font-weight:500;font-size:15px;transition:.12s}
.opt kbd{font:700 12px 'Space Grotesk';color:var(--mute);border:1px solid var(--line);border-radius:6px;padding:2px 7px}
.opt:hover:not(:disabled){border-color:#666}
.opt.ok{border-color:var(--ok);background:#0c1f14}.opt.bad{border-color:var(--bad);background:#240d0d}
.fb{border-radius:14px;padding:12px 14px;margin:6px 0 12px;font-size:14px}
.fb.ok{background:#0c1f14;border:1px solid #1f5a39}.fb.bad{background:#240d0d;border:1px solid #6b1f1f}
.row{display:flex;justify-content:space-between;align-items:center;gap:10px}
.x{font-size:22px;color:var(--mute);padding:4px 8px}
.ach{display:flex;gap:12px;align-items:center;padding:10px 0;border-bottom:1px solid var(--line);font-size:14px}
.ach:last-child{border:0}.ach.off{opacity:.33}
.ach>span{font-size:22px;width:32px;text-align:center;flex:none}
.skill{margin:12px 0}.skill .row{font-size:13px}
nav.tabs{position:fixed;bottom:0;left:0;right:0;z-index:5;display:flex;background:rgba(6,6,6,.94);backdrop-filter:blur(10px);border-top:1px solid var(--line)}
nav.tabs button{flex:1;padding:10px 2px 13px;font-size:11px;color:var(--mute);font-weight:700}
nav.tabs button.on{color:var(--red2)}
nav.tabs button em{display:block;font-style:normal;font-size:20px}
.big{font-family:'Pirata One';font-size:76px;text-align:center;line-height:1;text-shadow:0 0 34px rgba(225,6,0,.6)}
.center{text-align:center}
.foot{font-size:11px;color:#5c5c5c;text-align:center;margin-top:20px}
.shake{animation:sh .3s}@keyframes sh{25%{transform:translateX(-6px)}75%{transform:translateX(6px)}}
.pop{animation:pp .35s}@keyframes pp{0%{transform:translateY(10px);opacity:0}100%{transform:none;opacity:1}}
input[type=file]{display:none}
h2.sec{font-size:36px;line-height:1.05;margin:4px 0 6px}
p.lead{color:#c9c9c9;font-size:15px;margin-bottom:6px}

.ring b{width:58px;height:58px;border-radius:50%;background:#101010;display:grid;place-items:center;font-size:13px}
.ticker{overflow:hidden;white-space:nowrap;border-block:1px solid var(--line);padding:8px 0;margin:0 0 14px;color:#6d6d6d;font-size:12px;letter-spacing:3px;text-transform:uppercase}
.ticker span{display:inline-block;animation:mq 26s linear infinite}@keyframes mq{to{transform:translateX(-50%)}}
.track{display:flex;align-items:center;gap:14px;padding:12px;border:1px solid var(--line);border-radius:14px;background:#0d0d0d;margin-top:10px;text-decoration:none;transition:.15s}
.track:hover{border-color:var(--red)}
.track .no{font-family:'Pirata One';font-size:26px;color:var(--red2);width:34px;text-align:center}
.track .go{margin-left:auto;color:var(--mute);font-size:13px;font-weight:700}
.eq{display:flex;gap:3px;align-items:flex-end;height:26px}
.eq i{width:4px;background:var(--red2);border-radius:2px;height:20%}

@keyframes eq{to{height:100%}}
textarea,input[type=text]{width:100%;background:#0b0b0b;border:1px solid var(--line);color:var(--ink);border-radius:12px;padding:12px;font:inherit;font-size:15px;margin-top:8px}
textarea{min-height:150px;resize:vertical}

.line{font-size:22px;line-height:1.9;font-weight:500;margin:14px 0}

.line input.ok{border-color:var(--ok);color:var(--ok)}.line input.bad{border-color:var(--bad);color:var(--bad)}
.seg{display:inline-flex;border:1px solid var(--line);border-radius:11px;overflow:hidden}
.seg button{padding:8px 12px;font-size:13px;font-weight:700;color:var(--mute)}.seg button.on{background:var(--red);color:#fff}
.tl{position:relative;padding-left:22px;border-left:2px solid #3a0a0a;margin:16px 0 4px 6px}
.tl .ev{position:relative;margin-bottom:20px}
.tl .ev:before{content:"";position:absolute;left:-29px;top:6px;width:12px;height:12px;border-radius:50%;background:var(--red);box-shadow:0 0 12px var(--red)}
.tl .when{font-size:12px;color:var(--red2);font-weight:700;letter-spacing:1.5px;text-transform:uppercase}
.tl h3{font-size:24px;line-height:1.1;margin:2px 0 4px}
.tl p{font-size:14px;color:#c9c9c9}
.note{font-size:13px;color:var(--mute);border:1px dashed #333;border-radius:12px;padding:10px 12px;margin-top:10px}
.miss{font-size:14px;padding:10px 0;border-bottom:1px solid var(--line)}.miss:last-child{border:0}.miss b{color:var(--ok)}
.about p{margin:10px 0;color:#d6d6d6;font-size:15.5px}
.steps{display:grid;grid-template-columns:repeat(auto-fit,minmax(170px,1fr));gap:10px;margin-top:10px}
.steps div{border:1px solid var(--line);border-radius:14px;padding:12px;background:#0d0d0d;font-size:14px}
.steps b{display:block;font-family:'Pirata One';font-weight:400;font-size:21px;color:var(--red2)}
input[type=range]{width:100%;accent-color:var(--red)}
@media(min-width:760px){.links{display:flex}nav.tabs{display:none}main{padding-bottom:60px}.rank{font-size:60px}.hero{padding:30px}}
@media(prefers-reduced-motion:reduce){*{animation:none!important;transition:none!important}}
</style>
</head>

const shuffle=a=>{a=a.slice();for(let i=a.length-1;i>0;i--){const j=Math.random()*(i+1)|0;[a[i],a[j]]=[a[j],a[i]]}return a};
const esc=s=>String(s).replace(/[&<>"]/g,c=>({"&":"&amp;","<":"&lt;",">":"&gt;",'"':"&quot;"}[c]));
function rank(){let r=0;RANKS.forEach((x,i)=>{if(S.xp>=x[0])r=i});return r}
function acc(m){const s=S.stats[m];return s&&s.t?Math.round(100*s.c/s.t):null}
function weakest(){let w=null,b=101;for(const m in MODS){const a=acc(m);if(a===null)return m;if(a<b){b=a;w=m}}return w}
function grant(id){if(!S.ach[id]){S.ach[id]=1;return true}return false}
function dayXp(){if(S.day.d!==today())S.day={d:today(),xp:0};return S.day.xp}

/* ---------- audio: sfx + original synth loop ---------- */
let AC=null,master=null,beatOn=false,beatTimer=null,step=0,nextT=0,noiseBuf=null,vol=.5;
function ctx(){if(!AC){const C=window.AudioContext||window.webkitAudioContext;if(!C)return null;AC=new C();master=AC.createGain();master.gain.value=vol;master.connect(AC.destination);
  noiseBuf=AC.createBuffer(1,AC.sampleRate*.2,AC.sampleRate);const d=noiseBuf.getChannelData(0);for(let i=0;i<d.length;i++)d[i]=Math.random()*2-1}
 if(AC.state==="suspended")AC.resume();return AC}
function tone(f,t,dur,type,g,dest){const o=AC.createOscillator(),a=AC.createGain();o.type=type;o.frequency.setValueAtTime(f,t);a.gain.setValueAtTime(g,t);a.gain.exponentialRampToValueAtTime(.001,t+dur);o.connect(a);a.connect(dest||AC.destination);o.start(t);o.stop(t+dur+.02);return o}
function sfx(ok){if(!S.sfx)return;try{if(!ctx())return;const t=AC.currentTime;if(ok){tone(660,t,.12,"triangle",.18);tone(990,t+.09,.18,"triangle",.18)}else{tone(140,t,.25,"sawtooth",.14)}}catch(e){}}
function dist(){const w=AC.createWaveShaper(),c=new Float32Array(256);for(let i=0;i<256;i++){const x=i/128-1;c[i]=Math.tanh(x*4)}w.curve=c;return w}
let drive=null;
const BASS=[43.65,0,0,43.65,0,0,51.91,0,0,0,43.65,38.89,0,0,58.27,0];
const LEAD=[349.2,0,415.3,0,523.3,0,415.3,349.2,0,311.1,0,415.3,523.3,0,622.3,0];
function playStep(i,t){
 if(BASS[i]){const o=tone(BASS[i]*2.2,t,.5,"sine",.9,drive);o.frequency.exponentialRampToValueAtTime(BASS[i],t+.09)}
 if(i%2===0||i===13||i===15){const s=AC.createBufferSource(),h=AC.createBiquadFilter(),a=AC.createGain();s.buffer=noiseBuf;h.type="highpass";h.frequency.value=7500;a.gain.setValueAtTime(i%4===0?.16:.09,t);a.gain.exponentialRampToValueAtTime(.001,t+.045);s.connect(h);h.connect(a);a.connect(master);s.start(t);s.stop(t+.06)}
 if(i===4||i===12){const s=AC.createBufferSource(),b=AC.createBiquadFilter(),a=AC.createGain();s.buffer=noiseBuf;b.type="bandpass";b.frequency.value=1900;a.gain.setValueAtTime(.3,t);a.gain.exponentialRampToValueAtTime(.001,t+.16);s.connect(b);b.connect(a);a.connect(master);s.start(t);s.stop(t+.18)}
 if(LEAD[i]){const f=AC.createBiquadFilter();f.type="lowpass";f.frequency.setValueAtTime(2600,t);f.frequency.exponentialRampToValueAtTime(500,t+.2);f.connect(drive);tone(LEAD[i],t,.2,"sawtooth",.1,f);tone(LEAD[i]*1.006,t,.2,"square",.05,f)}
}
function beat(on){
 if(on){if(!ctx())return;bg.pause();if(!drive){drive=dist();const g=AC.createGain();g.gain.value=.55;drive.connect(g);g.connect(master)}
  beatOn=true;step=0;nextT=AC.currentTime+.06;beatTimer=setInterval(()=>{while(nextT<AC.currentTime+.12){playStep(step%16,nextT);nextT+=60/148/4;step++}},25)}
 else{beatOn=false;clearInterval(beatTimer)}
}
const bg=$("#bg");let trackName="";
$("#trackFile").onchange=e=>{const f=e.target.files[0];if(!f)return;beat(false);bg.src=URL.createObjectURL(f);bg.volume=vol;trackName=f.name;bg.play().catch(()=>{});if(view==="listen")render()};

/* ---------- drills ---------- */
const fmt=s=>Math.floor(s/60)+":"+String(s%60).padStart(2,"0");
function start(kind,m){
 const pool=m?Q.filter(q=>q.m===m).length:99;
 D={kind,m,n:Math.min(pool,kind==="exam"?20:kind==="mod"?8:10),i:0,right:0,xp:0,combo:0,best:0,lvl:kind==="exam"?2:1,used:{},cur:null,answered:false,left:360,missed:[],r0:rank()};
 clearInterval(timer);
 if(kind==="exam")timer=setInterval(()=>{D.left--;const t=$("#clock");if(t)t.textContent=fmt(D.left);if(D.left<=0)finish()},1000);
 next();
}
function pick(){
 let pool=Q.filter(q=>!D.used[q.id]);const order=Object.keys(MODS);
 if(D.kind==="mod")pool=pool.filter(q=>q.m===D.m);
 else if(D.kind==="place")pool=pool.filter(q=>q.m===order[D.i%order.length]);
 else if(D.kind==="daily"&&Math.random()<.5){const w=weakest(),p=pool.filter(q=>q.m===w);if(p.length)pool=p}
 if(!pool.length)return null;
 for(const dd of [0,1,2]){const c=pool.filter(q=>Math.abs(q.d-D.lvl)===dd);if(c.length){const f=c.filter(q=>!S.seen[q.id]);return shuffle(f.length?f:c)[0]}}
 return pool[0];
}
function next(){
 if(D.i>=D.n)return finish();
 const q=pick();if(!q)return finish();
 D.cur=q;D.used[q.id]=1;D.answered=false;D.opts=shuffle(q.o);view="drill";render();
}
function drill(){
 const q=D.cur;
 app.innerHTML=`<div class="row"><button class="x" id="quit" aria-label="Quit">✕</button><div class="bar" style="flex:1"><i style="width:${100*D.i/D.n}%"></i></div>${D.kind==="exam"?`<span class="pill" id="clock">${fmt(D.left)}</span>`:`<span class="pill">🔥 ${D.combo}</span>`}</div>
 <div class="card pop" style="margin-top:12px">
  <div class="tag">${MODS[q.m].n} · ${["","Easy","Mid","Hard"][q.d]} · ${D.i+1}/${D.n}</div>
  <div class="q">${esc(q.q)}</div>
  ${D.opts.map((o,i)=>`<button class="opt" data-i="${i}"><kbd>${i+1}</kbd><span>${esc(o)}</span></button>`).join("")}
  <div id="fb"></div>
 </div>`;
 $("#quit").onclick=()=>go("quest");
 $$(".opt").forEach(b=>b.onclick=()=>answer(b));
}
function answer(b){
 if(D.answered)return;D.answered=true;
 const q=D.cur,ok=D.opts[+b.dataset.i]===q.o[0];
 $$(".opt").forEach(x=>{x.disabled=true;if(D.opts[+x.dataset.i]===q.o[0])x.classList.add("ok")});
 const st=S.stats[q.m]=S.stats[q.m]||{c:0,t:0};st.t++;S.seen[q.id]=1;
 let gain=0;
 if(ok){st.c++;D.right++;D.combo++;D.best=Math.max(D.best,D.combo);gain=10*q.d+(D.combo>=3?5:0);D.lvl=Math.min(3,D.lvl+1);if(D.combo>=5&&grant("combo5"))D.gotCombo=true}
 else{b.classList.add("bad","shake");D.combo=0;D.lvl=Math.max(1,D.lvl-1);D.missed.push(q)}
 sfx(ok);dayXp();S.day.xp+=gain;D.xp+=gain;S.xp+=gain;save();D.i++;chrome();
 $("#fb").innerHTML=`<div class="fb ${ok?"ok":"bad"}"><b>${ok?`Correct · +${gain} XP${D.combo>=3?" · combo bonus":""}`:"Not it."}</b><br>${esc(q.e)}</div><button class="btn" id="nx">${D.i>=D.n?"Finish":"Continue"}</button>`;
 $("#nx").onclick=next;
}
document.addEventListener("keydown",e=>{
 if(view!=="drill"||e.target.tagName==="INPUT"||e.target.tagName==="TEXTAREA")return;
 if(!D.answered&&e.key>="1"&&e.key<="4"){const b=$$(".opt")[+e.key-1];if(b)answer(b)}
 else if(D.answered&&e.key==="Enter"){e.preventDefault();next()}
});
function finish(){
 clearInterval(timer);
 const t=today();
 if(D.i&&S.last!==t){S.streak=S.last===dstr(Date.now()-864e5)?S.streak+1:1;S.last=t}

 if(D.i){g("first");if(D.right===D.i&&D.i>=8)g("perfect")}
 if(S.streak>=3)g("streak3");
 if(Object.keys(MODS).every(m=>S.stats[m]))g("all");
 if(D.kind==="exam"&&D.right/D.n>=.8)g("exam");
 if(rank()===RANKS.length-1)g("king");

 save();view="done";render();
}

const norm=s=>s.toLowerCase().replace(/[^a-z0-9]/g,"");
function memorize(){
 if(M.set===null||!SETS[M.set])return memList();
 const set=SETS[M.set],lines=set.text.split("\n").map(l=>l.trim()).filter(Boolean);
 if(M.line>=lines.length){
  const got=grant("bars");save();
  app.innerHTML=`<div class="card hero center pop">${BAT}<div class="tag">Set complete</div><div class="big" style="font-size:54px;margin:10px 0">Off the dome</div><p class="sub">${lines.length} lines of “${esc(set.title)}”.${got?" Trophy unlocked: Off the Dome.":""}</p></div>

  $("#again").onclick=()=>{M.line=0;memorize()};$("#back").onclick=()=>{M.set=null;memorize()};return}
 const words=lines[M.line].split(/\s+/);
 let body;
 if(M.mode==="blank"){
  const cand=words.map((w,i)=>norm(w).length>=3?i:-1).filter(i=>i>=0),k=Math.max(1,Math.ceil(cand.length*.4)),hide=new Set(shuffle(cand.length?cand:[0]).slice(0,k));
  body=words.map((w,i)=>hide.has(i)?`<input type="text" data-a="${esc(w)}" size="${Math.max(3,w.length)}" autocomplete="off" autocapitalize="off" spellcheck="false">`:esc(w)).join(" ");
 }else body=words.map(w=>`<span data-w="${esc(w)}">${esc(w[0])}${"·".repeat(Math.max(0,w.length-1))}</span>`).join(" ");
 app.innerHTML=`<div class="row"><button class="x" id="back" aria-label="Back">←</button><div class="bar" style="flex:1"><i style="width:${100*M.line/lines.length}%"></i></div><span class="pill">${M.line+1}/${lines.length}</span></div>
 <div class="card pop" style="margin-top:12px"><div class="row"><div class="tag">${esc(set.title)}</div><div class="seg"><button id="mB" class="${M.mode==="blank"?"on":""}">Blanks</button><button id="mL" class="${M.mode==="letters"?"on":""}">First letters</button></div></div>
  <div class="line" id="line">${body}</div>
  <div class="btns">${M.mode==="blank"?`<button class="btn" id="chk">Check</button>`:""}<button class="btn ghost" id="rev">Reveal</button><button class="btn ghost" id="nxl">Next line</button></div></div>`;
 $("#back").onclick=()=>{M.set=null;memorize()};

 const c=$("#chk");if(c){const check=()=>{let all=true;$$("#line input").forEach(i=>{const ok=norm(i.value)===norm(i.dataset.a);i.className=ok?"ok":"bad";all=all&&ok});sfx(all);if(all)setTimeout(()=>{M.line++;memorize()},500)};
  c.onclick=check;$$("#line input").forEach(i=>i.onkeydown=e=>{if(e.key==="Enter")check()});const f=$("#line input");if(f)f.focus()}

/* ---------- ember background ---------- */
(function(){
 const c=$("#fx"),x=c.getContext&&c.getContext("2d");if(!x||matchMedia("(prefers-reduced-motion:reduce)").matches)return;
 let W,H,P=[];const size=()=>{W=c.width=innerWidth;H=c.height=innerHeight};size();addEventListener("resize",size);
 for(let i=0;i<46;i++)P.push({x:Math.random(),y:Math.random(),r:Math.random()*1.8+.4,v:Math.random()*.0009+.0003,a:Math.random()*.5+.15,d:Math.random()*6});
 (function loop(t){x.clearRect(0,0,W,H);for(const p of P){p.y-=p.v;if(p.y<-.02){p.y=1.02;p.x=Math.random()}
  x.globalAlpha=p.a*(.6+.4*Math.sin(t/900+p.d));x.fillStyle="#ff2a1f";x.beginPath();x.arc((p.x+Math.sin(t/4000+p.d)*.01)*W,p.y*H,p.r,0,7);x.fill()}
  requestAnimationFrame(loop)})(0);
})();
